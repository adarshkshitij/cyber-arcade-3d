# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "Provide concise, actionable engineering feedback with specific code recommendations."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
  path_filters:
    - "!vendor/**"
    - "!**/*.min.js"
    - "!**/*.png"
chat:
  auto_reply: true
