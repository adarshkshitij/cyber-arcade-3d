# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ==============================================================================
# 🐇 CodeRabbit AI Configuration (.coderabbit.yaml)
# Production static architecture, security & code review guidelines
# ==============================================================================
language: "en-US"
tone_instructions: "Act as a Senior Principal Graphics & Web Performance Engineer. Be concise, actionable, and focus on memory leaks, deterministic physics state machines, and WebGL resource lifecycles."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!node_modules/**"
    - "!docs/**"
    - "!*.png"
    - "!*.jpg"
    - "!*.svg"
  path_instructions:
    - path: "engine.js"
      instructions: "Ensure pure deterministic logic with zero DOM access. Validate that collision mathematics and direction validation adhere to unit tests."
    - path: "racer-engine.js"
      instructions: "Check 60 FPS continuous steering math, obstacle bounds, and deterministic tick events."
    - path: "game.js"
      instructions: "Audit Three.js geometry/material disposal on restarts and game switches. Ensure no memory leaks or orphaned event listeners."
    - path: "style.css"
      instructions: "Audit responsive constraints, CSS container queries, and ensure strict [hidden] specificity."

chat:
  auto_reply: true
