# ==============================================================================
# 🔍 SonarQube & SonarCloud Project Configuration (sonar-project.properties)
# ==============================================================================
sonar.projectKey=adarshkshitij_cyber-arcade-3d
sonar.organization=adarshkshitij
sonar.projectName=cyber-arcade-3d
sonar.projectVersion=1.2.0

# Source & Test Code Analysis Scope
sonar.sources=.
sonar.inclusions=engine.js,racer-engine.js,game.js,index.html,style.css
sonar.exclusions=node_modules/**,test/**,docs/**,scratch/**,coverage/**,devops/**

sonar.tests=test
sonar.test.inclusions=test/*.test.js

# Language & Encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,node

# Quality Gate Thresholds
sonar.qualitygate.wait=false
sonar.cpd.exclusions=test/**
