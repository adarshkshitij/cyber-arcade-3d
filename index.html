<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Neon Snake Arcade</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js WebGL 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="arcade-shell">
    <header class="game-header">
      <h1 class="title">3D Neon Snake</h1>
      <span class="version-tag">WebGL 3D</span>
    </header>

    <!-- Glassmorphism 3D HUD -->
    <div class="hud">
      <div class="hud-badges">
        <div class="badge badge-score" id="scoreBadge">
          <span class="badge-label">Score</span>
          <span class="badge-value" id="score">0</span>
        </div>
        <div class="badge badge-high" id="highScoreBadge">
          <span class="badge-label">Best</span>
          <span class="badge-value" id="highScore">0</span>
        </div>
      </div>

      <div class="hud-controls">
        <!-- Difficulty Selection Buttons -->
        <div class="difficulty-group" role="group" aria-label="Game Difficulty">
          <button class="diff-btn" id="diffEasy" data-difficulty="easy" type="button">Easy</button>
          <button class="diff-btn active" id="diffNormal" data-difficulty="normal" type="button">Normal</button>
          <button class="diff-btn" id="diffBlitz" data-difficulty="blitz" type="button">Blitz</button>
        </div>

        <!-- Audio, Pause, and Camera Buttons -->
        <div class="icon-controls">
          <button id="muteBtn" class="icon-btn" type="button" aria-label="Toggle Sound" aria-pressed="false" title="Toggle Sound (M)">
            <span class="icon-on">🔊</span>
            <span class="icon-off" hidden>🔇</span>
          </button>
          <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause Game" aria-pressed="false" title="Pause / Resume (Space)">
            <span class="icon-pause">⏸</span>
            <span class="icon-play" hidden>▶</span>
          </button>
          <button id="cameraBtn" class="icon-btn" type="button" aria-label="Toggle Camera Angle" title="Switch 3D View (C)">
            <span>🎥</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 3D Game Viewport Container -->
    <div class="game-container" id="gameContainer">
      <div id="webglContainer"></div>
      
      <!-- Start Game Tap Prompt -->
      <div class="start-overlay" id="startOverlay">
        <div class="start-card">
          <span>TAP HERE OR STEER TO START</span>
        </div>
      </div>

      <div class="freeze-indicator" id="freezeIndicator" hidden>❄ FREEZE SLOW-MO</div>
      
      <div class="pause-overlay" id="pauseOverlay" hidden>
        <div class="pause-card">
          <h2>GAME PAUSED</h2>
          <p>Press <kbd>Space</kbd> or tap Resume to continue</p>
          <button id="resumeBtn" class="primary-btn" type="button">Resume</button>
        </div>
      </div>
    </div>

    <!-- Responsive Tactile 3D D-Pad -->
    <div class="dpad-container">
      <div class="dpad" aria-label="Touch D-Pad Controls">
        <button class="dpad-btn dpad-up" id="dpadUp" data-dir="up" aria-label="Move Up" type="button">▲</button>
        <button class="dpad-btn dpad-left" id="dpadLeft" data-dir="left" aria-label="Move Left" type="button">◀</button>
        <div class="dpad-center" aria-hidden="true"></div>
        <button class="dpad-btn dpad-right" id="dpadRight" data-dir="right" aria-label="Move Right" type="button">▶</button>
        <button class="dpad-btn dpad-down" id="dpadDown" data-dir="down" aria-label="Move Down" type="button">▼</button>
      </div>
    </div>

    <footer class="game-footer">
      <p class="hint">Use <kbd>Arrow Keys</kbd> or <kbd>W A S D</kbd> to steer &bull; <kbd>Space</kbd> to Pause &bull; <kbd>R</kbd> to Restart</p>
    </footer>
  </div>

  <!-- Game Over Modal -->
  <div id="gameOver" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h2 class="game-over-title">GAME OVER</h2>
      <div class="final-stats">
        <p>Final Score: <span id="finalScore" class="stat-highlight">0</span></p>
        <p class="new-best" id="newBestTag" hidden>🏆 NEW HIGH SCORE!</p>
      </div>
      <div class="modal-actions">
        <button id="restartBtn" class="primary-btn pulse-glow" type="button">Play Again (R)</button>
      </div>
    </div>
  </div>

  <!-- Core deterministic engine -->
  <script src="engine.js"></script>
  <!-- 3D WebGL game loop and UI controller -->
  <script src="game.js"></script>
</body>
</html>
